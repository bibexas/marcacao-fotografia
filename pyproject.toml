[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marcacao-fotografia"
version = "0.1.0"
description = "Sistema de marcação de sessões fotográficas"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1.3",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
